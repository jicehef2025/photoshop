<title>JCFOUCHE-PixelShop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,700&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Press+Start+2P&family=Bebas+Neue&family=Pacifico&display=swap">
<style>
/* Mise en page : barre de menus · barre d'options · outils | plan de travail | panneaux · barre d'état — un atelier sombre façon logiciel de retouche */
:root{
  --bg0:#16171a; --bg1:#222429; --bg2:#2a2d33; --bg3:#33373e; --bg4:#40454d;
  --line:#0e0f11; --line2:#3a3e46; --fg:#dadde3; --fg2:#a0a6b0; --fg3:#6c727c;
  --acc:#4c9dff; --acc2:#2c6cc0; --sel:#34445a; --warn:#e6a23c; --bad:#e5534b;
  --ui:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg0)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg0);color:var(--fg);font:13px/1.35 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
svg.ic{width:18px;height:18px;flex:none;display:block}
#app{height:100%;display:grid;grid-template-rows:32px 40px minmax(0,1fr) 26px}

/* barre de menus */
#menubar{display:flex;align-items:stretch;background:var(--bg1);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .mark{width:20px;height:20px;border-radius:4px;background:linear-gradient(135deg,#1a3f73,#4c9dff);display:grid;place-items:center;font:700 10px var(--mono);color:#e9f2ff}
#menus{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;min-width:0}
#menus::-webkit-scrollbar{display:none}
.mbtn{background:none;border:0;padding:0 10px;cursor:default;white-space:nowrap;color:var(--fg)}
.mbtn:hover,.mbtn.open{background:var(--bg3)}
.spacer{flex:1}
.mb-act{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line2);border-radius:4px;margin:4px 6px 4px 0;padding:0 10px;cursor:pointer;white-space:nowrap}
.mb-act:hover{background:var(--bg3);border-color:var(--fg3)}
.mb-act.primary{background:var(--acc2);border-color:var(--acc2);color:#fff}
.mb-act.primary:hover{background:var(--acc)}
.mb-act svg{width:15px;height:15px}
.only-narrow{display:none}

.dd{position:fixed;z-index:50;background:var(--bg2);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);min-width:250px;padding:4px 0;border-radius:0 0 4px 4px}
.mi{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:5px 14px 5px 24px;white-space:nowrap;cursor:default;position:relative}
.mi:hover,.mi.hot{background:var(--acc2);color:#fff}
.mi.dis{color:var(--fg3);pointer-events:none}
.mi .k{color:var(--fg2);font:11px var(--mono)}
.mi:hover .k{color:#dce9ff}
.mi.sub::after{content:"";border:4px solid transparent;border-left-color:currentColor;position:absolute;right:8px;top:50%;transform:translateY(-50%)}
.dd .sep{height:1px;background:var(--line2);margin:4px 0}
.dd .grp{padding:6px 14px 2px 24px;color:var(--fg3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

/* barre d'options */
#optbar{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}
.ot{display:flex;align-items:center;gap:7px;color:var(--fg);padding-right:12px;border-right:1px solid var(--line2);height:24px}
.oc{display:flex;align-items:center;gap:6px;color:var(--fg2)}
.oc input[type=range]{width:96px;accent-color:var(--acc)}
.num{width:52px;height:24px;background:var(--bg0);border:1px solid var(--line2);border-radius:3px;padding:0 5px;font:12px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.sel{height:24px;background:var(--bg0);border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--fg)}
.chk{display:flex;align-items:center;gap:5px;color:var(--fg2)}
.chk input{accent-color:var(--acc)}
.obtn{height:24px;padding:0 10px;background:var(--bg3);border:1px solid var(--line2);border-radius:3px;cursor:pointer}
.obtn:hover{background:var(--bg4)}
.obtn.go{background:var(--acc2);border-color:var(--acc2);color:#fff}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{height:24px;width:28px;border:0;background:var(--bg0);display:grid;place-items:center;cursor:pointer;color:var(--fg2)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--bg4);color:#fff}
.seg svg{width:16px;height:16px}
.hint{color:var(--fg3)}

/* zone principale */
.main{display:grid;grid-template-columns:44px minmax(0,1fr) 296px;min-height:0}
.main.nopanels{grid-template-columns:44px minmax(0,1fr) 0}
.main.nopanels #panels{display:none}
#toolbar{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:1px;overflow-y:auto;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
.tb{width:34px;height:30px;border:0;background:none;border-radius:4px;display:grid;place-items:center;cursor:pointer;color:var(--fg2);flex:none}
.tb:hover{background:var(--bg3);color:var(--fg)}
.tb.on{background:var(--bg4);color:#fff;box-shadow:inset 0 0 0 1px #5a606a}
.tsep{width:24px;height:1px;background:var(--line2);margin:4px 0;flex:none}
.colors{position:relative;width:38px;height:40px;margin-top:8px;flex:none}
.sw{position:absolute;width:22px;height:22px;border:1px solid #000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);cursor:pointer;padding:0}
#fgSw{left:3px;top:3px;z-index:2}
#bgSw{left:13px;top:13px}
.cmini{position:absolute;border:0;background:none;color:var(--fg2);cursor:pointer;padding:0;width:12px;height:12px}
.cmini svg{width:12px;height:12px}
#swapC{right:0;top:0}
#resetC{left:0;bottom:0}

.work{display:grid;grid-template-rows:28px minmax(0,1fr);min-width:0;min-height:0}
#tabs{display:flex;align-items:flex-end;background:var(--bg1);border-bottom:1px solid var(--line);padding-left:4px;overflow:hidden}
.tab{height:26px;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--bg0);border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
.tab .meta{color:var(--fg2);font:11px var(--mono)}
#viewport{position:relative;overflow:hidden;background:var(--bg0);min-height:0}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#dropHint{position:absolute;inset:12px;border:2px dashed var(--acc);border-radius:8px;display:grid;place-items:center;font-size:16px;color:#cfe3ff;background:rgba(20,40,70,.55);pointer-events:none}

/* panneaux */
#panels{background:var(--bg1);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto;scrollbar-width:thin}
.pg{border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.pg.grow{flex:1 0 220px;min-height:220px}
.ptabs{display:flex;background:var(--bg2);height:26px;border-bottom:1px solid var(--line)}
.ptab{border:0;background:none;padding:0 12px;color:var(--fg2);cursor:pointer;font-size:12px;border-right:1px solid var(--line)}
.ptab.on{background:var(--bg1);color:var(--fg)}
.pbody{padding:8px 10px}
.pane[hidden]{display:none!important}
#nav{width:100%;height:128px;display:block;border-radius:2px;background:var(--bg0);cursor:pointer;touch-action:none}
.navz{display:flex;align-items:center;gap:8px;margin-top:6px}
.navz input[type=range]{flex:1;accent-color:var(--acc);min-width:0}
.crow{display:grid;grid-template-columns:14px minmax(0,1fr) 46px;align-items:center;gap:8px;margin:6px 0}
.crow label{color:var(--fg2);font:11px var(--mono)}
.crow input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:10px;border-radius:2px;border:1px solid var(--line);background:var(--bg0)}
.crow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:14px;background:#fff;border:1px solid #000;border-radius:1px}
.crow input[type=range]::-moz-range-thumb{width:7px;height:13px;background:#fff;border:1px solid #000;border-radius:1px}
.chead{display:flex;align-items:center;gap:10px}
.cprev{width:46px;height:30px;border:1px solid var(--line);border-radius:2px;flex:none}
.hex{width:88px;height:24px;background:var(--bg0);border:1px solid var(--line2);border-radius:3px;padding:0 6px;font:12px var(--mono);text-transform:uppercase}
.swg{margin-bottom:8px}
.swg .lbl{color:var(--fg3);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin:2px 0 4px}
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(18px,1fr));gap:3px}
.swc{aspect-ratio:1;border:1px solid var(--line);border-radius:2px;cursor:pointer;padding:0;max-width:100%}
.swc:hover{outline:1px solid #fff}

.lhead{display:flex;align-items:center;gap:8px;padding:8px 10px 6px}
.lhead .sel{flex:1;min-width:0}
.lhead .oc{gap:4px}
#layerList{flex:1;overflow-y:auto;min-height:80px;border-top:1px solid var(--line);scrollbar-width:thin}
.lrow{display:grid;grid-template-columns:26px 46px minmax(0,1fr);align-items:center;gap:8px;height:42px;padding:0 8px 0 4px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:hover{background:var(--bg2)}
.lrow.on{background:var(--sel)}
.lrow.drop{box-shadow:inset 0 2px 0 var(--acc)}
.eye{width:24px;height:24px;border:0;background:none;color:var(--fg2);display:grid;place-items:center;cursor:pointer;padding:0}
.eye.off{opacity:.25}
.thumb{width:46px;height:34px;border:1px solid #000;display:block;background-color:#ccc;background-image:linear-gradient(45deg,#999 25%,transparent 25%,transparent 75%,#999 75%),linear-gradient(45deg,#999 25%,transparent 25%,transparent 75%,#999 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.lname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname small{display:block;color:var(--fg3);font:10px var(--mono)}
.lname input{width:100%;height:22px;background:var(--bg0);border:1px solid var(--acc);padding:0 4px}
.lfoot{display:flex;justify-content:flex-end;gap:2px;padding:4px 6px;background:var(--bg2);border-top:1px solid var(--line)}
.lfoot button{width:28px;height:24px;border:0;background:none;border-radius:3px;color:var(--fg2);display:grid;place-items:center;cursor:pointer}
.lfoot button:hover{background:var(--bg4);color:#fff}
.lfoot svg{width:16px;height:16px}
#histList{max-height:180px;overflow-y:auto;scrollbar-width:thin}
.hrow{padding:4px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center}
.hrow:hover{background:var(--bg2)}
.hrow.on{background:var(--sel)}
.hrow.fut{color:var(--fg3)}
.hrow i{font:10px var(--mono);color:var(--fg3);font-style:normal;width:22px;text-align:right}

/* barre d'état */
#status{display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--bg1);border-top:1px solid var(--line);font:11px var(--mono);color:var(--fg2);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
#status .z{width:62px;height:18px;background:var(--bg0);border:1px solid var(--line2);border-radius:2px;font:11px var(--mono);padding:0 4px;color:var(--fg)}
#status .pix{display:inline-block;width:10px;height:10px;border:1px solid #000;vertical-align:-1px;margin-right:4px}
#status .tip{margin-left:auto;font-family:var(--ui);font-size:12px;color:var(--fg3);overflow:hidden;text-overflow:ellipsis}

/* boîtes de dialogue */
.modal{position:fixed;inset:0;z-index:80;background:rgba(5,6,8,.35);display:grid;place-items:center;padding:16px}
.dlg{background:var(--bg1);border:1px solid var(--line);border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.6);width:min(420px,100%);max-height:calc(100% - 16px);display:flex;flex-direction:column;user-select:text;-webkit-user-select:text}
.dlg.wide{width:min(720px,100%)}
.dlg-h{padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line);border-radius:6px 6px 0 0;font-weight:600;cursor:move}
.dlg-b{padding:14px;overflow-y:auto;display:grid;gap:10px}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.dlg-f button{height:28px;padding:0 16px;border-radius:4px;border:1px solid var(--line2);background:var(--bg3);cursor:pointer}
.dlg-f button.go{background:var(--acc2);border-color:var(--acc2);color:#fff}
.dlg-f button:hover{filter:brightness(1.15)}
.fr{display:grid;grid-template-columns:150px minmax(0,1fr);align-items:center;gap:10px}
.fr>span{color:var(--fg2)}
.fr .rr{display:flex;gap:8px;align-items:center;min-width:0}
.fr .rr input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.fr input[type=text],.fr input[type=number],.fr select,.fr textarea{background:var(--bg0);border:1px solid var(--line2);border-radius:3px;height:26px;padding:0 6px;min-width:0;width:100%}
.fr textarea{height:90px;padding:6px;resize:vertical;font-family:var(--ui)}
.fr .chk{gap:8px}
.note{color:var(--fg2);font-size:12px;line-height:1.5;max-width:62ch}
.note b{color:var(--fg)}
.anchor{display:grid;grid-template-columns:repeat(3,26px);gap:3px}
.anchor button{width:26px;height:26px;border:1px solid var(--line2);background:var(--bg0);cursor:pointer;border-radius:2px}
.anchor button.on{background:var(--acc2)}
.sv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;min-height:300px}
.fmtlist{border:1px solid var(--line);border-radius:4px;overflow-y:auto;max-height:52vh;background:var(--bg0)}
.fmtlist .g{padding:6px 10px 3px;color:var(--fg3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.fmtlist button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:5px 10px;text-align:left;cursor:pointer;color:var(--fg)}
.fmtlist button span{color:var(--fg3);font:11px var(--mono)}
.fmtlist button:hover{background:var(--bg2)}
.fmtlist button.on{background:var(--acc2);color:#fff}
.fmtlist button.on span{color:#dce9ff}
.fmtopts{display:grid;gap:10px;align-content:start;min-width:0}
.fmtopts h3{margin:0;font-size:15px}
.kbd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;font-size:12px}
.kbd span:nth-child(even){font:11px var(--mono);color:var(--fg2);text-align:right}
.kbd h4{grid-column:1/-1;margin:8px 0 2px;color:var(--fg3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}

#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:90;display:grid;gap:6px;justify-items:center;pointer-events:none;width:min(560px,calc(100% - 32px))}
.tst{background:#0b0c0e;border:1px solid var(--line2);border-left:3px solid var(--acc);padding:8px 14px;border-radius:4px;box-shadow:0 8px 24px rgba(0,0,0,.5);color:var(--fg);font-size:13px;animation:tin .18s ease-out}
.tst.err{border-left-color:var(--bad)}
.tst.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.tst{animation:none}}
[hidden]{display:none!important}
.fr .rr .num{width:72px;flex:none}
/* oscilloscope */
.sch{align-items:center}
.sch .spacer{flex:1}
.scfs{display:flex;align-items:center;gap:5px;height:20px;margin-right:4px;padding:0 8px;border:1px solid var(--line2);border-radius:3px;background:var(--bg3);color:var(--fg);font-size:11.5px;cursor:pointer}
.scfs:hover{background:var(--bg4)}
.scfs svg{width:12px;height:12px}
.scb{display:grid;gap:7px}
.scrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg2{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg2 button{height:22px;padding:0 8px;border:0;background:var(--bg0);color:var(--fg2);font-size:11.5px;cursor:pointer}
.seg2 button+button{border-left:1px solid var(--line2)}
.seg2 button.on{background:var(--bg4);color:#fff}
.scg{font-size:11.5px;flex:1;min-width:0}
.scg input{flex:1;min-width:40px;width:auto;accent-color:#86e0a2}
.scwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.scopebox{position:relative;height:200px;background:#060708;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.scopebox canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#scOv{cursor:crosshair}
.zl{display:none;flex-direction:column;gap:6px;min-width:0;overflow-y:auto}
.zl .zt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg3)}
.zr{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:2px 7px;align-items:center;font-size:12.5px}
.zr i{width:9px;height:9px;border-radius:2px}
.zr .r{grid-column:2/-1;font:10.5px var(--mono);color:var(--fg3)}
.zr .p{font:12px var(--mono);font-variant-numeric:tabular-nums}
.zr .bar{grid-column:2/-1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.zr .bar span{display:block;height:100%}
.zr.ill .p{color:var(--bad)}
.scstat{font:11px var(--mono);color:var(--fg2);font-variant-numeric:tabular-nums}
.scstat b{color:var(--bad);font-weight:500}
.scstat .ok{color:#86e0a2}
.scprobe{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:start;padding:6px 8px;border:1px solid #5a4a1c;border-left:3px solid #ffd34d;border-radius:3px;background:#17150e;font:11px/1.55 var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.scprobe .pdot{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px #000;margin-top:2px}
.scprobe .cr{color:#ff8a80}.scprobe .cg{color:#7fe88b}.scprobe .cb{color:#90a8ff}
.scprobe .bad{color:var(--bad)!important;font-weight:600}
.scprobe button{border:0;background:none;color:var(--fg2);font-size:15px;line-height:1;cursor:pointer;padding:0 2px}
.scprobe button:hover{color:#fff}
.legal{height:28px;border-radius:4px;border:1px solid #6a5420;background:#3a2f12;color:#f3d27a;font-weight:600;cursor:pointer;letter-spacing:.01em}
.legal:hover{background:#4a3c16;border-color:#e8b84a}
.legal.inv{border-color:#24506a;background:#11303f;color:#9fd6f5}
.legal.inv:hover{background:#163c4f;border-color:#5bb5e8}
.legrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
#scBay.fs,#scBay:fullscreen{position:fixed;inset:0;z-index:70;background:var(--bg1);display:flex;flex-direction:column;border:0}
#scBay:fullscreen::backdrop{background:var(--bg0)}
#scBay.fs .scb,#scBay:fullscreen .scb{flex:1;min-height:0;grid-template-rows:auto minmax(0,1fr) auto auto auto;padding:12px 16px}
#scBay.fs .scwrap,#scBay:fullscreen .scwrap{grid-template-columns:minmax(0,1fr) 250px;min-height:0}
#scBay.fs .scopebox,#scBay:fullscreen .scopebox{height:100%}
#scBay.fs .zl,#scBay:fullscreen .zl{display:flex}
#scBay.fs .legrow,#scBay:fullscreen .legrow{grid-template-columns:repeat(2,max-content)}
#scBay.fs .legal,#scBay:fullscreen .legal{padding:0 18px}
#scBay.fs .scg,#scBay:fullscreen .scg{flex:0 1 260px}
@media (max-width:700px){#scBay.fs .scwrap,#scBay:fullscreen .scwrap{grid-template-columns:minmax(0,1fr)}#scBay.fs .zl,#scBay:fullscreen .zl{display:none}}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;left:0;bottom:0}

@media (max-width:860px){
  .main{grid-template-columns:42px minmax(0,1fr)}
  #panels{position:fixed;right:0;top:72px;bottom:26px;width:min(300px,86vw);z-index:40;box-shadow:-12px 0 30px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .2s}
  #panels.open{transform:none}
  .only-narrow{display:flex}

}
function syncScopeFull() {

  $('#scFull').setAttribute('aria-pressed', on); setTimeout(scopeRender, 60);
}
function rangeOf() {
  ensureComposed(); const d = S.doc, a = g2(S.comp).getImageData(0, 0, d.w, d.h).data; let lo = 255, hi = 0;
  for (let i = 0; i < a.length; i += 4) { if (a[i + 3] < 8) continue; const r = a[i], g = a[i + 1], b = a[i + 2]; if (r < lo) lo = r; if (g < lo) lo = g; if (b < lo) lo = b; if (r > hi) hi = r; if (g > hi) hi = g; if (b > hi) hi = b; }
  return [lo, hi];
}
function applyLut(lut, label) {
  const d = S.doc;
  for (const l of d.layers) {
    const lg = g2(l.c), id = lg.getImageData(0, 0, d.w, d.h), a = id.data;
    for (let i = 0; i < a.length; i += 4) { if (!a[i + 3]) continue; a[i] = lut[a[i]]; a[i + 1] = lut[a[i + 1]]; a[i + 2] = lut[a[i + 2]]; }
    lg.putImageData(id, 0, 0); touch(l);
  }
  dirty(); refreshLayers(); pushHist(label);
}
async function legalise() {
  const [lo, hi] = rangeOf();
  if (lo >= 16 && hi <= 235 && !await confirmDlg('Legalise Full range → Legal Range', `L'image est déjà dans la plage légale (valeurs ${lo}–${hi}). Une nouvelle conversion compresserait encore le signal vers 16–235. Convertir quand même ?`, 'Convertir')) return;
  const lut = new Uint8ClampedArray(256); for (let v = 0; v < 256; v++) lut[v] = Math.round(16 + v * 219 / 255);
  applyLut(lut, 'Legalise Full → Legal (16–235)');
  toast('Image convertie de la plage pleine (0–255) vers la plage légale Rec.709 (16–235).');
}
async function toFullRange() {
  const [lo, hi] = rangeOf();
  if ((lo < 16 || hi > 235) && !await confirmDlg('Legalise Legal Range → Full Range', `L'image contient des valeurs hors de 16–235 (valeurs ${lo}–${hi}). Elles seront écrêtées à 0 et 255 pendant l'expansion. Convertir quand même ?`, 'Convertir')) return;
  const lut = new Uint8ClampedArray(256); for (let v = 0; v < 256; v++) lut[v] = Math.round((v - 16) * 255 / 219);
  applyLut(lut, 'Legal → Full (0–255)');
  toast('Image convertie de la plage légale Rec.709 (16–235) vers la plage pleine (0–255).');
}
(() => {
  $('#scMode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; [...$('#scMode').children].forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); SC.mode = b.dataset.v; scopeRender(); });

})();
